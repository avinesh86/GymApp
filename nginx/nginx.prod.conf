# Production nginx for fitops.northernarena.co.nz
#
# Kept separate from nginx/nginx.conf because docker-compose.yml (local dev)
# mounts that file, and the ssl_certificate directives below would stop nginx
# from starting on a machine with no Let's Encrypt certificates.
#
# Bootstrap (chicken-and-egg: nginx needs a certificate to start, certbot
# needs nginx to answer the ACME challenge) is handled by
# scripts/init-letsencrypt.sh, which drops a self-signed placeholder in
# place first.  See DEPLOY_DOMAIN.md.

# Resolved at request time via Docker's embedded DNS rather than once at
# startup. An "upstream" block caches the container IP it saw when nginx
# booted, so recreating web (every deploy does) leaves nginx dialling a dead
# address and serving 502 until someone restarts it.
resolver 127.0.0.11 valid=10s ipv6=off;

# ─── Port 80: ACME challenges, everything else redirected to HTTPS ───────────
server {
    listen 80 default_server;
    server_name _;

    # Must stay reachable over plain HTTP — this is how Let's Encrypt proves
    # domain control, both at issuance and on every 60-day renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── Port 443: the application ───────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name fitops.northernarena.co.nz;

    ssl_certificate     /etc/letsencrypt/live/fitops.northernarena.co.nz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fitops.northernarena.co.nz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # No Strict-Transport-Security here on purpose: Django already emits it
    # from SECURE_HSTS_SECONDS in fitops/settings/prod.py, and two copies of
    # the header is a spec violation some browsers ignore outright.

    # CSV/member imports (apps/imports) post large files.
    client_max_body_size 50M;

    # Single Cache-Control header on purpose. Using "expires" alongside
    # add_header emits two of them (nginx does not merge), which is what
    # nginx/nginx.conf does today.
    location /static/ {
        alias /app/staticfiles/;
        add_header Cache-Control "public, immutable, max-age=2592000";
    }

    location /media/ {
        alias /app/media/;
        add_header Cache-Control "public, max-age=604800";
    }

    # Django: the API and the admin. Everything else is the React app, which
    # the frontend container serves — the web image never runs "npm run build",
    # so SPAView has no index.html to return and 404s on every page.
    location /api/ {
        set $django web:8000;
        proxy_pass http://$django$request_uri;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location /platform-admin/ {
        set $django web:8000;
        proxy_pass http://$django$request_uri;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location / {
        set $spa frontend:3000;
        proxy_pass http://$spa$request_uri;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }
}
