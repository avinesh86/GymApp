services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: gunicorn fitops.wsgi:application --bind 0.0.0.0:8000 --workers 4 --worker-class gthread --threads 2 --timeout 120 --max-requests 1000 --max-requests-jitter 50
    env_file: .env
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always
    deploy:
      replicas: 2

  worker:
    build: .
    command: scripts/celery-entrypoint.sh worker
    env_file: .env
    volumes:
      - media_files:/app/media
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  beat:
    build: .
    command: scripts/celery-entrypoint.sh beat
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY}
    # No published port: nginx is the only way in. docker-compose.yml exposes
    # 3000 for local dev, which is also how this host was reachable before TLS.
    expose:
      - "3000"
    depends_on:
      - web
    restart: always

  nginx:
    # Pinned: nginx.prod.conf uses the "http2 on;" directive, which needs 1.25.1+.
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/proxy_headers.inc:/etc/nginx/conf.d/proxy_headers.inc:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - frontend
    restart: always
    # Certbot renews in place; nginx only picks up the new certificate on a
    # reload, so reload periodically rather than waiting for a restart.
    command: >
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # A no-op until a certificate is within 30 days of expiry.
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    depends_on:
      - nginx
    restart: always

volumes:
  mysql_data:
  media_files:
  static_files:
  certbot_conf:
  certbot_www:
