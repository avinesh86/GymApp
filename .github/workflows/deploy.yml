name: Deploy

# Runs only after CI has passed on main, so a red build never reaches the
# server. Also available as a manual button in the Actions tab for redeploys
# and rollbacks.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit SHA to deploy
        required: false
        default: main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    # workflow_run fires on failure too — only deploy the successful ones.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          # The deploy itself backs up, migrates, health-checks and rolls back
          # on failure — see scripts/deploy.sh.
          command_timeout: 20m
          script: |
            set -e
            REF=${{ github.event.inputs.ref || 'main' }}
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin "$REF"
            # Run the script as it exists on the ref being deployed, not the
            # copy in the working tree: the tree may predate the script
            # entirely, and leaving it untouched keeps the rollback target
            # accurate until the script decides to move it.
            git show "origin/${REF}:scripts/deploy.sh" > /tmp/fitops-deploy.sh
            PROJECT_DIR=${{ secrets.DEPLOY_PATH }} DEPLOY_BRANCH="$REF" \
              bash /tmp/fitops-deploy.sh

      - name: Report rollback
        if: failure()
        run: |
          echo "::error::Deploy failed. scripts/deploy.sh rolls the code back"
          echo "::error::automatically — check the SSH step output to confirm the"
          echo "::error::rollback came up healthy, and whether migrations had run."

  release:
    name: Create GitHub Release
    needs: deploy
    # Only for automatic deploys of main (a release or hotfix merge). Manual
    # runs from the Actions tab are redeploys or rollbacks, not new releases.
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Tag the deployed commit and publish a release
        run: |
          set -euo pipefail

          # vYYYY.MM.DD, then .2, .3… for further releases the same day.
          base="v$(date -u +%Y.%m.%d)"
          tag="$base"
          n=1
          while gh release view "$tag" >/dev/null 2>&1 \
             || gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; do
            n=$((n + 1))
            tag="$base.$n"
          done

          # The release notes are the description of the pull request that
          # was merged to produce this commit (the release or hotfix PR).
          pr_json=$(gh api "repos/$GH_REPO/commits/$SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0] // empty')

          if [ -n "$pr_json" ]; then
            title=$(jq -r '.title' <<<"$pr_json")
            number=$(jq -r '.number' <<<"$pr_json")
            {
              jq -r '.body // ""' <<<"$pr_json"
              echo
              echo "Released from #$number."
            } > notes.md
            gh release create "$tag" --target "$SHA" \
              --title "$tag: $title" --notes-file notes.md
          else
            gh release create "$tag" --target "$SHA" \
              --title "$tag" --generate-notes
          fi

          echo "Published $tag for $SHA" >> "$GITHUB_STEP_SUMMARY"
