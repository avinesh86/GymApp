name: CI

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: fitops.settings.ci
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      FIELD_ENCRYPTION_KEY: Zml0b3BzLWNpLXRlc3Qta2V5LTMyLWJ5dGVzLWxvbmc=
      PYTHONPATH: ${{ github.workspace }}
      # Dummy values so base.py imports without error (ci.py overrides DATABASES)
      MYSQL_DATABASE: unused
      MYSQL_USER: unused
      MYSQL_PASSWORD: unused

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            libcairo2 libffi-dev shared-mime-info \
            default-libmysqlclient-dev pkg-config

      - name: Install Python dependencies
        run: pip install -r requirements/ci.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run --settings=fitops.settings.ci

      - name: Run tests with coverage
        run: |
          pytest \
            --ds=fitops.settings.ci \
            --tb=short \
            -v \
            --cov=apps \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  mysql-schema:
    # Production runs MySQL; the Python Tests job uses SQLite. This job builds a
    # fresh MySQL database from the migrations, proves the resulting tables
    # match the models (check_db_schema), and runs the invoice paths that 500'd
    # in production — Invoices, Reports → Financial, saving pay rates — on it.
    name: MySQL Schema Check
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fitops
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DJANGO_SETTINGS_MODULE: fitops.settings.ci_mysql
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      FIELD_ENCRYPTION_KEY: Zml0b3BzLWNpLXRlc3Qta2V5LTMyLWJ5dGVzLWxvbmc=
      PYTHONPATH: ${{ github.workspace }}
      MYSQL_DATABASE: fitops
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            libcairo2 libffi-dev shared-mime-info \
            default-libmysqlclient-dev pkg-config

      - name: Install Python dependencies
        run: pip install -r requirements/ci.txt

      - name: Apply every migration to a fresh MySQL database
        run: python manage.py migrate --noinput

      - name: Check the MySQL tables match the models
        run: python manage.py check_db_schema

      - name: Run invoice, payroll and schema tests on MySQL
        run: |
          pytest --ds=fitops.settings.ci_mysql --tb=short -q \
            tests/test_check_db_schema.py \
            tests/test_invoice_calculations.py \
            tests/test_invoice_generation.py \
            tests/test_invoice_redesign.py \
            tests/test_class_rates.py \
            tests/test_reports.py

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check apps/ tests/ fitops/ --config=ruff.toml --output-format=github

      - name: Run ruff format check
        run: ruff format --check apps/ tests/ fitops/
        continue-on-error: true

  frontend:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: UI Tests
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: fitops.settings.ci
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      FIELD_ENCRYPTION_KEY: Zml0b3BzLWNpLXRlc3Qta2V5LTMyLWJ5dGVzLWxvbmc=
      PYTHONPATH: ${{ github.workspace }}
      MYSQL_DATABASE: unused
      MYSQL_USER: unused
      MYSQL_PASSWORD: unused
      # No nginx here, so Vite proxies straight to Django. changeOrigin rewrites
      # the Host header to this, and the gym is resolved from it — so the seed
      # below registers 127.0.0.1 as a host.
      VITE_API_PROXY_TARGET: http://127.0.0.1:8000
      E2E_SKIP_SEED: '1'
      # A file, not :memory: — migrate and runserver are separate processes.
      CI_SQLITE_PATH: /tmp/fitops-e2e.sqlite3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # WeasyPrint needs these to make PDFs (the report export is clicked
      # through in the UI tests).
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            libcairo2 libffi-dev shared-mime-info

      - name: Install Python dependencies
        run: pip install -r requirements/ci.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Prepare the database
        run: |
          python manage.py migrate --noinput
          python manage.py seed_e2e_owner --domain 127.0.0.1 --create-missing

      - name: Start the API
        run: |
          python manage.py runserver 127.0.0.1:8000 --noreload &
          npx --yes wait-on http://127.0.0.1:8000/api/v1/public/health/ --timeout 60000

      - name: Start the frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 &
          npx --yes wait-on http://127.0.0.1:5173 --timeout 60000

      - name: Run the UI tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
        run: npx playwright test

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
